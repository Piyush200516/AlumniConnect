version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alumniconnect-backend
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://neondb_owner:npg_J8hwtiySU0zA@ep-green-art-ap5hjgzj-pooler.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require&pgbouncer=true}
      - DIRECT_URL=${DIRECT_URL:-postgresql://neondb_owner:npg_J8hwtiySU0zA@ep-green-art-ap5hjgzj.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require}
      - JWT_SECRET=${JWT_SECRET:-CHANGE_ME_TO_A_LONG_RANDOM_STRING}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5002/api}
    container_name: alumniconnect-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always
